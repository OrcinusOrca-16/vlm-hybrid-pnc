<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Closed-Loop Control Summary</title>
  <desc id="desc">Comparison of Sampling and Optimization planners on control-side metrics across common-success scenarios.</desc>
  <rect width="1200" height="850" fill="white"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #222; }
    .main { font-size: 28px; font-weight: 600; }
    .sub { font-size: 18px; }
    .panel-title { font-size: 20px; font-weight: 600; }
    .direction { font-size: 14px; }
    .label { font-size: 15px; }
    .value { font-size: 14px; font-weight: 600; }
    .sampling { fill: #d62728; }
    .optimization { fill: #9467bd; }
    .axis { stroke: #555; stroke-width: 1.5; }
    .grid { stroke: #dddddd; stroke-width: 1; }
  </style>

  <text x="600" y="42" text-anchor="middle" class="main">Closed-Loop Control Summary</text>
  <text x="600" y="70" text-anchor="middle" class="sub">Common-success scenarios only</text>
  <rect x="445" y="90" width="28" height="16" rx="2" class="sampling"/>
  <text x="483" y="104" class="label">Sampling</text>
  <rect x="600" y="90" width="28" height="16" rx="2" class="optimization"/>
  <text x="638" y="104" class="label">Optimization</text>

  <!-- Panel 1: safe speed -->
  <text x="310" y="145" text-anchor="middle" class="panel-title">Safe Speed</text>
  <text x="310" y="168" text-anchor="middle" class="direction">higher is better</text>
  <line x1="90" y1="385" x2="530" y2="385" class="axis"/>
  <line x1="90" y1="205" x2="90" y2="385" class="axis"/>
  <line x1="90" y1="340" x2="530" y2="340" class="grid"/><line x1="90" y1="295" x2="530" y2="295" class="grid"/><line x1="90" y1="250" x2="530" y2="250" class="grid"/><line x1="90" y1="205" x2="530" y2="205" class="grid"/>
  <text x="78" y="390" text-anchor="end" class="label">0</text><text x="78" y="345" text-anchor="end" class="label">1</text><text x="78" y="300" text-anchor="end" class="label">2</text><text x="78" y="255" text-anchor="end" class="label">3</text><text x="78" y="210" text-anchor="end" class="label">4</text>
  <rect x="205" y="228.7" width="90" height="156.3" class="sampling"/><rect x="315" y="247.4" width="90" height="137.6" class="optimization"/>
  <text x="250" y="220" text-anchor="middle" class="value">3.473</text><text x="360" y="239" text-anchor="middle" class="value">3.058</text>
  <text x="310" y="414" text-anchor="middle" class="label">Mean constant safe speed [m/s]</text>

  <!-- Panel 2: system lateral error -->
  <text x="890" y="145" text-anchor="middle" class="panel-title">System Lateral Error</text>
  <text x="890" y="168" text-anchor="middle" class="direction">lower is better</text>
  <line x1="670" y1="385" x2="1110" y2="385" class="axis"/><line x1="670" y1="205" x2="670" y2="385" class="axis"/>
  <line x1="670" y1="340" x2="1110" y2="340" class="grid"/><line x1="670" y1="295" x2="1110" y2="295" class="grid"/><line x1="670" y1="250" x2="1110" y2="250" class="grid"/><line x1="670" y1="205" x2="1110" y2="205" class="grid"/>
  <text x="658" y="390" text-anchor="end" class="label">0.000</text><text x="658" y="345" text-anchor="end" class="label">0.004</text><text x="658" y="300" text-anchor="end" class="label">0.008</text><text x="658" y="255" text-anchor="end" class="label">0.012</text><text x="658" y="210" text-anchor="end" class="label">0.016</text>
  <rect x="785" y="273.7" width="90" height="111.3" class="sampling"/><rect x="895" y="236.8" width="90" height="148.2" class="optimization"/>
  <text x="830" y="265" text-anchor="middle" class="value">0.00989</text><text x="940" y="228" text-anchor="middle" class="value">0.01317</text>
  <text x="890" y="414" text-anchor="middle" class="label">Mean system RMS lateral error [m]</text>

  <!-- Panel 3: same-speed lateral error -->
  <text x="310" y="495" text-anchor="middle" class="panel-title">Same-Speed Lateral Error</text>
  <text x="310" y="518" text-anchor="middle" class="direction">lower is better</text>
  <line x1="90" y1="735" x2="530" y2="735" class="axis"/><line x1="90" y1="555" x2="90" y2="735" class="axis"/>
  <line x1="90" y1="690" x2="530" y2="690" class="grid"/><line x1="90" y1="645" x2="530" y2="645" class="grid"/><line x1="90" y1="600" x2="530" y2="600" class="grid"/><line x1="90" y1="555" x2="530" y2="555" class="grid"/>
  <text x="78" y="740" text-anchor="end" class="label">0.000</text><text x="78" y="695" text-anchor="end" class="label">0.003</text><text x="78" y="650" text-anchor="end" class="label">0.006</text><text x="78" y="605" text-anchor="end" class="label">0.009</text><text x="78" y="560" text-anchor="end" class="label">0.012</text>
  <rect x="205" y="636.8" width="90" height="98.2" class="sampling"/><rect x="315" y="568.7" width="90" height="166.3" class="optimization"/>
  <text x="250" y="628" text-anchor="middle" class="value">0.00655</text><text x="360" y="560" text-anchor="middle" class="value">0.01109</text>
  <text x="310" y="764" text-anchor="middle" class="label">Mean same-speed RMS lateral error [m]</text>

  <!-- Panel 4: feedback effort -->
  <text x="890" y="495" text-anchor="middle" class="panel-title">Same-Speed Feedback Effort</text>
  <text x="890" y="518" text-anchor="middle" class="direction">lower is better</text>
  <line x1="670" y1="735" x2="1110" y2="735" class="axis"/><line x1="670" y1="555" x2="670" y2="735" class="axis"/>
  <line x1="670" y1="690" x2="1110" y2="690" class="grid"/><line x1="670" y1="645" x2="1110" y2="645" class="grid"/><line x1="670" y1="600" x2="1110" y2="600" class="grid"/><line x1="670" y1="555" x2="1110" y2="555" class="grid"/>
  <text x="658" y="740" text-anchor="end" class="label">0.00</text><text x="658" y="695" text-anchor="end" class="label">0.02</text><text x="658" y="650" text-anchor="end" class="label">0.04</text><text x="658" y="605" text-anchor="end" class="label">0.06</text><text x="658" y="560" text-anchor="end" class="label">0.08</text>
  <rect x="785" y="673.6" width="90" height="61.4" class="sampling"/><rect x="895" y="575.3" width="90" height="159.7" class="optimization"/>
  <text x="830" y="665" text-anchor="middle" class="value">0.0273</text><text x="940" y="567" text-anchor="middle" class="value">0.0710</text>
  <text x="890" y="764" text-anchor="middle" class="label">Mean same-speed max |feedback| [rad]</text>
</svg>