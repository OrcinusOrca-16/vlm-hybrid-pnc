name: Temporary Sampling Tuning Validation

on:
  push:
    branches:
      - chore/sampling-tuning-diagnostics

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply tuning-runner and skill upgrade
        run: |
          python tools/patch_sampling_tuning_upgrade.py
          python -m py_compile scripts/planning/run_sampling_tuning.py

      - name: Validate candidate diagnostics
        run: |
          python - <<'PY'
          from scripts.planning import run_sampling_tuning as tuning

          _, active_scenarios, _ = tuning.prepare_scenarios()
          scenarios_by_name = {
              scenario.name: scenario
              for scenario in active_scenarios
          }
          selected_names = (
              'tuning_lateral_recovery',
              'tuning_obstacle_lateral_+0.75',
              'road_half_width_2.00',
          )
          selected = tuple(
              scenarios_by_name[name]
              for name in selected_names
              if name in scenarios_by_name
          )
          if not selected:
              raise SystemExit('No diagnostic smoke scenarios found.')

          config = tuning.SamplingTuningConfig(
              name='diagnostic_smoke',
              bypass_lateral_positions_m=(
                  -2.0, -1.5, -1.0, -0.5, 0.0,
                  0.5, 1.0, 1.5, 2.0,
              ),
              bypass_lengths_m=(6.0, 10.0, 14.0, 18.0, 22.0),
          )
          evaluation = tuning.evaluate_config(
              config=config,
              scenarios=selected,
              planner_weights=(
                  tuning.DEFAULT_SAMPLING_PLANNER_CONFIG
                  .matched_objective_weights
              ),
          )

          for scenario_name, outcome in evaluation.outcomes.items():
              generated = outcome.generated_candidate_count
              feasible = outcome.feasible_candidate_count
              rejected = (
                  outcome.curvature_reject_count
                  + outcome.clearance_reject_count
                  + outcome.road_boundary_reject_count
              )
              if generated != config.candidate_count:
                  raise SystemExit(
                      f'{scenario_name}: generated count mismatch: '
                      f'{generated} != {config.candidate_count}'
                  )
              if feasible + rejected != generated:
                  raise SystemExit(
                      f'{scenario_name}: diagnostic accounting mismatch'
                  )
              if not 0.0 <= outcome.feasible_ratio <= 1.0:
                  raise SystemExit(
                      f'{scenario_name}: invalid feasible ratio'
                  )

          print('Candidate diagnostic accounting passed.')
          PY

      - name: Validate evidence-driven CLI modes
        run: |
          python - <<'PY'
          import json
          import sys

          from scripts.planning import run_sampling_tuning as tuning

          all_scenarios, active_scenarios, _ = tuning.prepare_scenarios()
          scenario = next(
              item
              for item in active_scenarios
              if item.name == 'tuning_lateral_recovery'
          )
          smoke_config = tuning.SamplingTuningConfig(
              name='mode_smoke',
              bypass_lateral_positions_m=(
                  -2.0, -1.5, -1.0, -0.5, 0.0,
                  0.5, 1.0, 1.5, 2.0,
              ),
              bypass_lengths_m=(8.0, 14.0, 22.0),
          )

          tuning.prepare_scenarios = lambda: (
              (scenario,),
              (scenario,),
              {},
          )
          tuning.build_structure_configs = lambda: (smoke_config,)

          sys.argv = [
              'run_sampling_tuning',
              '--stop-after-structure',
          ]
          tuning.main()
          with tuning.SUMMARY_JSON_PATH.open(encoding='utf-8') as file:
              data = json.load(file)
          if 'stage_a_structure' not in data:
              raise SystemExit('Stage A summary missing.')
          if 'stage_b_terminal' in data or 'stage_c_weight_sensitivity' in data:
              raise SystemExit('Stage-A-only mode continued past Stage A.')
          if not data['metadata']['stop_after_structure']:
              raise SystemExit('Stage-A-only metadata flag missing.')

          tuning._RUN_CACHE.clear()
          tuning._CANDIDATE_CACHE.clear()
          tuning._CANDIDATE_DIAGNOSTIC_CACHE.clear()

          sys.argv = [
              'run_sampling_tuning',
              '--skip-terminal',
          ]
          tuning.main()
          with tuning.SUMMARY_JSON_PATH.open(encoding='utf-8') as file:
              data = json.load(file)
          stage_a = data['stage_a_structure']
          stage_b = data['stage_b_terminal']
          if not stage_b['terminal_sweep_skipped']:
              raise SystemExit('Skip-terminal metadata flag missing.')
          if set(stage_a['pareto_config_names']) != set(stage_b['pareto_config_names']):
              raise SystemExit('Skip-terminal mode changed carried Pareto configs.')
          for config in stage_b['configs']:
              if config['final_lateral_offsets_m'] != [0.0]:
                  raise SystemExit('Skip-terminal expanded final lateral state.')
              if config['final_slope_offsets'] != [0.0]:
                  raise SystemExit('Skip-terminal expanded final slope state.')
          if 'stage_c_weight_sensitivity' not in data:
              raise SystemExit('Skip-terminal did not reach weight sensitivity.')

          print('Evidence-driven CLI modes passed.')
          PY

      - name: Run planning regressions
        run: |
          python -m scripts.planning.validate_reference_line
          python -m scripts.planning.validate_frenet
          python -m scripts.planning.validate_sampling_planner
          python -m scripts.planning.validate_sampling_benchmark_adapter
          python -m scripts.planning.validate_canonical_benchmark
          python -m scripts.planning.validate_discrete_scenario_benchmark
          python -m scripts.planning.validate_stress_benchmark
          python -m scripts.planning.validate_runtime_benchmark

      - name: Commit validated target changes to validation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/planning/run_sampling_tuning.py .agents/skills/sampling-planner-tuning/SKILL.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Improve Sampling tuning diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
