name: Validate Sampling guided tuning

on:
  push:
    branches:
      - chore/sampling-tuning-diagnostics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile scripts/planning/run_sampling_tuning.py
          python -m py_compile scripts/planning/run_sampling_tuning_guided.py
      - name: Run historical Sampling tuning
        run: |
          python -m scripts.planning.run_sampling_tuning
          cp outputs/tuning/sampling_tuning_summary.json /tmp/legacy_sampling_summary.json
      - name: Run guided structural tuning
        run: python -m scripts.planning.run_sampling_tuning_guided --mode structure
      - name: Compare Stage A with historical runner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          legacy = json.loads(Path('/tmp/legacy_sampling_summary.json').read_text())
          guided = json.loads(Path('outputs/tuning/sampling_tuning_guided_summary.json').read_text())
          old = legacy['stage_a_structure']
          new = guided['stage_a_structure']

          assert old['max_success_count'] == new['max_success_count']
          assert old['total_active_scenarios'] == new['total_active_scenarios']
          assert old['common_comparison_scenarios'] == new['common_comparison_scenarios']

          old_configs = {item['name']: item for item in old['configs']}
          new_configs = {item['name']: item for item in new['configs']}
          assert old_configs.keys() == new_configs.keys()

          for name in old_configs:
              before = old_configs[name]
              after = new_configs[name]
              for key in ('candidate_count', 'success_count', 'total_count', 'failure_names'):
                  assert before[key] == after[key], (name, key, before[key], after[key])
              for key in ('mean_success_objective', 'comparison_objective'):
                  a = before[key]
                  b = after[key]
                  if a is None or b is None:
                      assert a == b
                  else:
                      assert abs(a - b) < 1e-12, (name, key, a, b)

              generated = after['generated_candidate_total']
              classified = (
                  after['feasible_candidate_total']
                  + after['curvature_reject_total']
                  + after['clearance_reject_total']
                  + after['road_boundary_reject_total']
              )
              assert generated == classified, (name, generated, classified)

          print('Guided Stage A matches historical Stage A deterministically.')
          PY
      - name: Run guided strict flow
        run: python -m scripts.planning.run_sampling_tuning_guided --mode strict
      - name: Planner regressions
        run: |
          python -m scripts.planning.validate_sampling_planner
          python -m scripts.planning.validate_sampling_benchmark_adapter
          python -m scripts.planning.validate_tuning_objective_separation
          python -m scripts.planning.validate_canonical_benchmark
          python -m scripts.planning.validate_discrete_scenario_benchmark
          python -m scripts.planning.validate_stress_benchmark
