<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Frozen Planning-Only Benchmark Summary</title>
  <desc id="desc">Comparison of Sampling and Optimization planners across planning coverage, runtime, objective and lateral deviation, and peak curvature.</desc>
  <rect width="1200" height="850" fill="white"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #222; }
    .main { font-size: 28px; font-weight: 600; }
    .panel { font-size: 20px; font-weight: 600; }
    .label { font-size: 15px; }
    .value { font-size: 14px; font-weight: 600; }
    .axis { stroke: #555; stroke-width: 1.5; }
    .grid { stroke: #dddddd; stroke-width: 1; }
    .sampling { fill: #d62728; }
    .optimization { fill: #9467bd; }
  </style>

  <text x="600" y="42" text-anchor="middle" class="main">Frozen Planning-Only Benchmark Summary</text>

  <rect x="445" y="66" width="28" height="16" rx="2" class="sampling"/>
  <text x="483" y="80" class="label">Sampling</text>
  <rect x="600" y="66" width="28" height="16" rx="2" class="optimization"/>
  <text x="638" y="80" class="label">Optimization</text>

  <!-- Panel 1: coverage -->
  <text x="310" y="132" text-anchor="middle" class="panel">Planning Coverage</text>
  <line x1="90" y1="370" x2="530" y2="370" class="axis"/>
  <line x1="90" y1="190" x2="90" y2="370" class="axis"/>
  <line x1="90" y1="334" x2="530" y2="334" class="grid"/>
  <line x1="90" y1="298" x2="530" y2="298" class="grid"/>
  <line x1="90" y1="262" x2="530" y2="262" class="grid"/>
  <line x1="90" y1="226" x2="530" y2="226" class="grid"/>
  <line x1="90" y1="190" x2="530" y2="190" class="grid"/>
  <text x="78" y="375" text-anchor="end" class="label">0</text>
  <text x="78" y="339" text-anchor="end" class="label">2</text>
  <text x="78" y="303" text-anchor="end" class="label">4</text>
  <text x="78" y="267" text-anchor="end" class="label">6</text>
  <text x="78" y="231" text-anchor="end" class="label">8</text>
  <text x="78" y="195" text-anchor="end" class="label">10</text>
  <rect x="205" y="226" width="90" height="144" class="sampling"/>
  <rect x="315" y="208" width="90" height="162" class="optimization"/>
  <text x="250" y="218" text-anchor="middle" class="value">8 / 9</text>
  <text x="360" y="200" text-anchor="middle" class="value">9 / 9</text>
  <text x="305" y="398" text-anchor="middle" class="label">Successful scenarios</text>

  <!-- Panel 2: runtime -->
  <text x="890" y="132" text-anchor="middle" class="panel">Planner Runtime (all 9 scenarios)</text>
  <line x1="670" y1="370" x2="1110" y2="370" class="axis"/>
  <line x1="670" y1="190" x2="670" y2="370" class="axis"/>
  <line x1="670" y1="325" x2="1110" y2="325" class="grid"/>
  <line x1="670" y1="280" x2="1110" y2="280" class="grid"/>
  <line x1="670" y1="235" x2="1110" y2="235" class="grid"/>
  <line x1="670" y1="190" x2="1110" y2="190" class="grid"/>
  <text x="658" y="375" text-anchor="end" class="label">0</text>
  <text x="658" y="330" text-anchor="end" class="label">50</text>
  <text x="658" y="285" text-anchor="end" class="label">100</text>
  <text x="658" y="240" text-anchor="end" class="label">150</text>
  <text x="658" y="195" text-anchor="end" class="label">200 ms</text>
  <rect x="785" y="198.4" width="90" height="171.6" class="sampling"/>
  <rect x="895" y="328.3" width="90" height="41.7" class="optimization"/>
  <text x="830" y="190" text-anchor="middle" class="value">190.7 ms</text>
  <text x="940" y="320" text-anchor="middle" class="value">46.3 ms</text>
  <text x="885" y="398" text-anchor="middle" class="label">Mean runtime</text>

  <!-- Panel 3: objective / lateral deviation -->
  <text x="310" y="472" text-anchor="middle" class="panel">Path Objective / Lateral Deviation (common 8)</text>
  <line x1="90" y1="710" x2="530" y2="710" class="axis"/>
  <line x1="90" y1="530" x2="90" y2="710" class="axis"/>
  <line x1="90" y1="650" x2="530" y2="650" class="grid"/>
  <line x1="90" y1="590" x2="530" y2="590" class="grid"/>
  <line x1="90" y1="530" x2="530" y2="530" class="grid"/>
  <text x="78" y="715" text-anchor="end" class="label">0.0</text>
  <text x="78" y="655" text-anchor="end" class="label">0.2</text>
  <text x="78" y="595" text-anchor="end" class="label">0.4</text>
  <text x="78" y="535" text-anchor="end" class="label">0.6</text>
  <rect x="135" y="556.2" width="70" height="153.8" class="sampling"/>
  <rect x="215" y="649.1" width="70" height="60.9" class="optimization"/>
  <rect x="340" y="525.3" width="70" height="184.7" class="sampling"/>
  <rect x="420" y="596.8" width="70" height="113.2" class="optimization"/>
  <text x="170" y="548" text-anchor="middle" class="value">0.5125</text>
  <text x="250" y="641" text-anchor="middle" class="value">0.2029</text>
  <text x="375" y="517" text-anchor="middle" class="value">0.6156 m</text>
  <text x="455" y="589" text-anchor="middle" class="value">0.3772 m</text>
  <text x="210" y="738" text-anchor="middle" class="label">Canonical objective</text>
  <text x="415" y="738" text-anchor="middle" class="label">RMS lateral deviation</text>

  <!-- Panel 4: curvature -->
  <text x="890" y="472" text-anchor="middle" class="panel">Peak Curvature Trade-off (common 8)</text>
  <line x1="670" y1="710" x2="1110" y2="710" class="axis"/>
  <line x1="670" y1="530" x2="670" y2="710" class="axis"/>
  <line x1="670" y1="650" x2="1110" y2="650" class="grid"/>
  <line x1="670" y1="590" x2="1110" y2="590" class="grid"/>
  <line x1="670" y1="530" x2="1110" y2="530" class="grid"/>
  <text x="658" y="715" text-anchor="end" class="label">0.00</text>
  <text x="658" y="655" text-anchor="end" class="label">0.04</text>
  <text x="658" y="595" text-anchor="end" class="label">0.08</text>
  <text x="658" y="535" text-anchor="end" class="label">0.12</text>
  <rect x="785" y="594.2" width="90" height="115.8" class="sampling"/>
  <rect x="895" y="537.2" width="90" height="172.8" class="optimization"/>
  <text x="830" y="586" text-anchor="middle" class="value">0.0772 1/m</text>
  <text x="940" y="529" text-anchor="middle" class="value">0.1152 1/m</text>
  <text x="885" y="738" text-anchor="middle" class="label">Mean max |curvature|</text>

  <text x="600" y="815" text-anchor="middle" class="label" fill="#666">Sampling = red · Optimization = purple</text>
</svg>
