 <defs>
  <style type="text/css">*{stroke-linejoin: round; stroke-linecap: butt}</style>
 </defs>
 <rect width="756" height="540" fill="white"/>
 <style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #222; }
  .main { font-size: 18px; font-weight: 600; }
  .sub { font-size: 14px; }
  .panel { font-size: 12px; }
  .axislabel { font-size: 11px; }
  .tick { font-size: 10px; }
  .value { font-size: 9px; font-weight: 600; }
  .sampling { fill: #d62728; }
  .optimization { fill: #9467bd; }
  .axis { stroke: #555; stroke-width: 1; }
  .grid { stroke: #dddddd; stroke-width: 1; }
 </style>
 <text x="378" y="28" text-anchor="middle" class="main">Planning Metrics vs Closed-Loop Trackability</text>
 <text x="378" y="47" text-anchor="middle" class="sub">Common-success scenarios only</text>
