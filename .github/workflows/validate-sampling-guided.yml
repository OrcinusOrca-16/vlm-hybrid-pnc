name: Validate Sampling guided tuning

on:
  push:
    branches:
      - chore/sampling-tuning-diagnostics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile scripts/planning/run_sampling_tuning.py
          python -m py_compile scripts/planning/run_sampling_tuning_guided.py
      - name: Compare guided Stage A with legacy Stage A functions
        run: |
          python - <<'PY'
          from scripts.planning import run_sampling_tuning as legacy
          from scripts.planning import run_sampling_tuning_guided as guided
          from src.config.planning import DEFAULT_SAMPLING_PLANNER_CONFIG

          _, scenarios, _ = legacy.prepare_scenarios()
          weights = DEFAULT_SAMPLING_PLANNER_CONFIG.matched_objective_weights

          legacy_evaluations = [
              legacy.evaluate_config(
                  config=config,
                  scenarios=scenarios,
                  planner_weights=weights,
              )
              for config in legacy.build_structure_configs()
          ]
          legacy_max, legacy_common, legacy_group = (
              legacy.configure_common_objective(legacy_evaluations)
          )
          legacy_frontier = legacy.pareto_frontier(legacy_group)

          (
              guided_evaluations,
              guided_frontier,
              guided_common,
              guided_summary,
          ) = guided.run_structure_stage(
              active_scenarios=scenarios,
              planner_weights=weights,
          )

          assert legacy_max == guided_summary['max_success_count']
          assert sorted(legacy_common) == guided_summary['common_comparison_scenarios']
          assert [e.config.name for e in legacy_frontier] == [
              e.config.name for e in guided_frontier
          ]

          before = {e.config.name: e for e in legacy_evaluations}
          after = {e.config.name: e for e in guided_evaluations}
          assert before.keys() == after.keys()

          for name in before:
              a = before[name]
              b = after[name]
              assert a.success_count == b.success_count, name
              assert a.failure_names == b.failure_names, name
              if a.comparison_objective is None or b.comparison_objective is None:
                  assert a.comparison_objective == b.comparison_objective
              else:
                  assert abs(a.comparison_objective - b.comparison_objective) < 1e-12

              diag = next(
                  item for item in guided_summary['configs']
                  if item['name'] == name
              )
              classified = (
                  diag['feasible_candidate_total']
                  + diag['curvature_reject_total']
                  + diag['clearance_reject_total']
                  + diag['road_boundary_reject_total']
              )
              assert diag['generated_candidate_total'] == classified, name

          print('Guided Stage A exactly matches legacy Stage A logic.')
          print(f'Max coverage: {legacy_max}/{len(scenarios)}')
          print('Pareto:', [e.config.name for e in legacy_frontier])
          PY
      - name: Run guided CLI modes
        run: |
          python -m scripts.planning.run_sampling_tuning_guided --mode structure
          python -m scripts.planning.run_sampling_tuning_guided --mode strict
      - name: Planner regressions
        run: |
          python -m scripts.planning.validate_sampling_planner
          python -m scripts.planning.validate_sampling_benchmark_adapter
          python -m scripts.planning.validate_tuning_objective_separation
          python -m scripts.planning.validate_canonical_benchmark
          python -m scripts.planning.validate_discrete_scenario_benchmark
          python -m scripts.planning.validate_stress_benchmark
